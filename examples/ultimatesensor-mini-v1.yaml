# Example: UltimateSensor Mini V1 with the shared LD2450 packages
#
# Minimal standalone configuration for testing the polygon zones layer.
# The production configs live in the ultimatesensor-mini repository.

substitutions:
  device_name: ultimatesensor-mini-ld2450-test
  friendly_name: "UltimateSensor Mini LD2450 Test"
  ld2450_uart_tx_pin: GPIO13
  ld2450_uart_rx_pin: GPIO14

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}

captive_portal:

packages:
  ld2450_base: github://smarthomeshop/ld2450/packages/ld2450-base.yaml@main
  ld2450_zones: github://smarthomeshop/ld2450/packages/ld2450-polygon-zones.yaml@main
