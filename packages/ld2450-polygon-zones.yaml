# SmartHomeShop LD2450 polygon zones package
#
# Adds polygon detection zones, polygon exclusion zones, entry lines with
# people counting and the SmartHomeShop panel push API on top of the shared
# LD2450 base package. Coordinates are expressed in millimetres.
#
#   packages:
#     ld2450_base: github://smarthomeshop/ld2450/packages/ld2450-base.yaml@v1.0.0
#     ld2450_zones: github://smarthomeshop/ld2450/packages/ld2450-polygon-zones.yaml@v1.0.0
#
# Zone data formats (pushed by the SmartHomeShop panel):
#   polygon:    "x1:y1;x2:y2;x3:y3;..."  (mm, sensor coordinates, max 20 points)
#   entry line: "x1:y1;x2:y2;left" or "x1:y1;x2:y2;right"

substitutions:
  room_designer_target_count: "3"
  room_designer_coordinate_scale: "1.0f"
  room_designer_target_1_x_id: radar_target1_x
  room_designer_target_1_y_id: radar_target1_y
  room_designer_target_2_x_id: radar_target2_x
  room_designer_target_2_y_id: radar_target2_y
  room_designer_target_3_x_id: radar_target3_x
  room_designer_target_3_y_id: radar_target3_y
  room_designer_target_4_x_id: radar_target3_x
  room_designer_target_4_y_id: radar_target3_y
  room_designer_target_5_x_id: radar_target3_x
  room_designer_target_5_y_id: radar_target3_y

api:
  actions:
    - action: set_polygon_zone
      variables:
        zone_id: int
        polygon: string
      then:
        - lambda: |-
            if (zone_id == 1) { id(poly_zone_1).make_call().set_value(polygon).perform(); }
            else if (zone_id == 2) { id(poly_zone_2).make_call().set_value(polygon).perform(); }
            else if (zone_id == 3) { id(poly_zone_3).make_call().set_value(polygon).perform(); }
            else if (zone_id == 4) { id(poly_zone_4).make_call().set_value(polygon).perform(); }
    - action: set_polygon_exclusion
      variables:
        zone_id: int
        polygon: string
      then:
        - lambda: |-
            if (zone_id == 1) { id(poly_exclusion_1).make_call().set_value(polygon).perform(); }
            else if (zone_id == 2) { id(poly_exclusion_2).make_call().set_value(polygon).perform(); }
    - action: set_entry_line
      variables:
        line_id: int
        line_data: string
      then:
        - lambda: |-
            ESP_LOGI("ld2450_zones", "Setting entry line %d: %s", line_id, line_data.c_str());
            if (line_id == 1) { id(entry_line_1).make_call().set_value(line_data).perform(); }
            else if (line_id == 2) { id(entry_line_2).make_call().set_value(line_data).perform(); }
    - action: reset_people_count
      then:
        - lambda: |-
            id(room_people_count) = 0;
            id(people_count).publish_state(0);
            ESP_LOGI("ld2450_zones", "People count reset to 0");

globals:
  - id: room_people_count
    type: int
    restore_value: true
    initial_value: '0'

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(people_count).publish_state(id(room_people_count));
          id(last_crossing_direction).publish_state("none");

text:
  - platform: template
    name: "Polygon Zone 1"
    id: poly_zone_1
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Polygon Zone 2"
    id: poly_zone_2
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Polygon Zone 3"
    id: poly_zone_3
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Polygon Zone 4"
    id: poly_zone_4
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Polygon Exclusion 1"
    id: poly_exclusion_1
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Polygon Exclusion 2"
    id: poly_exclusion_2
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Entry Line 1"
    id: entry_line_1
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
  - platform: template
    name: "Entry Line 2"
    id: entry_line_2
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config

switch:
  - platform: template
    name: "Polygon Zones Enabled"
    id: polygon_zones_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

binary_sensor:
  - platform: template
    name: "Polygon Zone 1 Presence"
    id: poly_zone_1_presence
    device_class: occupancy
    filters:
      - delayed_off: 1s
  - platform: template
    name: "Polygon Zone 2 Presence"
    id: poly_zone_2_presence
    device_class: occupancy
    filters:
      - delayed_off: 1s
  - platform: template
    name: "Polygon Zone 3 Presence"
    id: poly_zone_3_presence
    device_class: occupancy
    filters:
      - delayed_off: 1s
  - platform: template
    name: "Polygon Zone 4 Presence"
    id: poly_zone_4_presence
    device_class: occupancy
    filters:
      - delayed_off: 1s

sensor:
  - platform: template
    name: "Polygon Zone 1 Target Count"
    id: poly_zone_1_count
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Polygon Zone 2 Target Count"
    id: poly_zone_2_count
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Polygon Zone 3 Target Count"
    id: poly_zone_3_count
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Polygon Zone 4 Target Count"
    id: poly_zone_4_count
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    name: "People Count"
    id: people_count
    icon: mdi:account-group
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

text_sensor:
  - platform: template
    name: "Last Crossing Direction"
    id: last_crossing_direction
    icon: mdi:swap-horizontal
    update_interval: never

button:
  - platform: template
    name: "Reset People Count"
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: |-
          id(room_people_count) = 0;
          id(people_count).publish_state(0);
          ESP_LOGI("ld2450_zones", "People count reset to 0");

interval:
  - interval: 250ms
    then:
      - lambda: |-
          // ---- Polygon zone engine ----
          struct Poly { float vx[20]; float vy[20]; int n; };
          struct Line { float x1, y1, x2, y2; bool in_is_left; bool valid; };
          static Poly zones[4];
          static Poly excls[2];
          static Line lines[2];
          static std::string zone_text[4], excl_text[2], line_text[2];
          static bool cache_init = false;
          static float prev_x[5], prev_y[5];
          static bool prev_ok[5] = {false, false, false, false, false};

          auto parse_poly = [](const std::string &s, Poly &p) {
            p.n = 0;
            size_t pos = 0;
            while (pos < s.length() && p.n < 20) {
              int x, y, consumed;
              if (sscanf(s.c_str() + pos, "%d:%d%n", &x, &y, &consumed) == 2) {
                p.vx[p.n] = (float) x;
                p.vy[p.n] = (float) y;
                p.n++;
                pos += consumed;
                if (pos < s.length() && s[pos] == ';') pos++;
              } else {
                break;
              }
            }
          };
          auto in_poly = [](float px, float py, const Poly &p) -> bool {
            if (p.n < 3) return false;
            bool inside = false;
            for (int i = 0, j = p.n - 1; i < p.n; j = i++) {
              float xi = p.vx[i], yi = p.vy[i];
              float xj = p.vx[j], yj = p.vy[j];
              if (((yi > py) != (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
                inside = !inside;
              }
            }
            return inside;
          };
          auto parse_line = [](const std::string &s, Line &l) {
            l.valid = false;
            if (s.empty()) return;
            int x1, y1, x2, y2;
            char dir[10];
            if (sscanf(s.c_str(), "%d:%d;%d:%d;%9s", &x1, &y1, &x2, &y2, dir) >= 4) {
              l.x1 = (float) x1; l.y1 = (float) y1;
              l.x2 = (float) x2; l.y2 = (float) y2;
              l.in_is_left = (strcmp(dir, "left") == 0);
              l.valid = true;
            }
          };
          auto side_of_line = [](float px, float py, const Line &l) -> float {
            return (l.x2 - l.x1) * (py - l.y1) - (l.y2 - l.y1) * (px - l.x1);
          };
          // Returns 0 = no crossing, 1 = crossed in the IN direction, -1 = OUT
          auto check_crossing = [&side_of_line](float px0, float py0, float px1, float py1, const Line &l) -> int {
            if (!l.valid) return 0;
            float side0 = side_of_line(px0, py0, l);
            float side1 = side_of_line(px1, py1, l);
            if (side0 * side1 >= 0) return 0;
            float dx = l.x2 - l.x1, dy = l.y2 - l.y1;
            float len_sq = dx * dx + dy * dy;
            if (len_sq < 1.0f) return 0;
            float dpx = px1 - px0, dpy = py1 - py0;
            float denom = dpx * (-dy) + dpy * dx;
            if (fabsf(denom) < 1e-6f) return 0;
            float t = ((l.x1 - px0) * (-dy) + (l.y1 - py0) * dx) / denom;
            if (t < 0.0f || t > 1.0f) return 0;
            float cx = px0 + t * dpx, cy = py0 + t * dpy;
            float u = ((cx - l.x1) * dx + (cy - l.y1) * dy) / len_sq;
            if (u < 0.0f || u > 1.0f) return 0;
            bool now_on_left = (side1 > 0);
            if (l.in_is_left) return now_on_left ? 1 : -1;
            return now_on_left ? -1 : 1;
          };

          // Re-parse zone/line definitions only when their text changed
          const std::string zt[4] = { id(poly_zone_1).state, id(poly_zone_2).state, id(poly_zone_3).state, id(poly_zone_4).state };
          const std::string et[2] = { id(poly_exclusion_1).state, id(poly_exclusion_2).state };
          const std::string lt[2] = { id(entry_line_1).state, id(entry_line_2).state };
          for (int i = 0; i < 4; i++) {
            if (!cache_init || zt[i] != zone_text[i]) { parse_poly(zt[i], zones[i]); zone_text[i] = zt[i]; }
          }
          for (int i = 0; i < 2; i++) {
            if (!cache_init || et[i] != excl_text[i]) { parse_poly(et[i], excls[i]); excl_text[i] = et[i]; }
            if (!cache_init || lt[i] != line_text[i]) { parse_line(lt[i], lines[i]); line_text[i] = lt[i]; }
          }
          cache_init = true;

          const int target_count = ${room_designer_target_count};
          if (!id(polygon_zones_enabled).state) {
            for (int i = 0; i < target_count; i++) prev_ok[i] = false;
            return;
          }

          const float scale = ${room_designer_coordinate_scale};
          const float tx[5] = {
            id(${room_designer_target_1_x_id}).state * scale,
            id(${room_designer_target_2_x_id}).state * scale,
            id(${room_designer_target_3_x_id}).state * scale,
            id(${room_designer_target_4_x_id}).state * scale,
            id(${room_designer_target_5_x_id}).state * scale
          };
          const float ty[5] = {
            id(${room_designer_target_1_y_id}).state * scale,
            id(${room_designer_target_2_y_id}).state * scale,
            id(${room_designer_target_3_y_id}).state * scale,
            id(${room_designer_target_4_y_id}).state * scale,
            id(${room_designer_target_5_y_id}).state * scale
          };
          int zone_count[4] = {0, 0, 0, 0};

          for (int t = 0; t < target_count; t++) {
            const bool active = !std::isnan(tx[t]) && !std::isnan(ty[t]) && (tx[t] != 0.0f || ty[t] != 0.0f);
            if (!active) { prev_ok[t] = false; continue; }
            const float px = tx[t], py = ty[t];

            const bool excluded = in_poly(px, py, excls[0]) || in_poly(px, py, excls[1]);
            // An excluded reflection must not update line history. Otherwise a
            // ghost can still change the persistent people count, or create a
            // false crossing when it leaves the exclusion polygon.
            if (excluded) {
              prev_ok[t] = false;
              continue;
            }
            for (int z = 0; z < 4; z++) {
              if (in_poly(px, py, zones[z])) zone_count[z]++;
            }

            if (prev_ok[t]) {
              for (int li = 0; li < 2; li++) {
                const int crossing = check_crossing(prev_x[t], prev_y[t], px, py, lines[li]);
                if (crossing != 0) {
                  int new_count = id(room_people_count) + crossing;
                  if (new_count < 0) new_count = 0;
                  id(room_people_count) = new_count;
                  id(people_count).publish_state(new_count);
                  id(last_crossing_direction).publish_state(crossing > 0 ? "in" : "out");
                  ESP_LOGI("ld2450_zones", "Target %d crossed entry line %d: %s (people=%d)",
                           t + 1, li + 1, crossing > 0 ? "IN" : "OUT", new_count);
                }
              }
            }
            prev_x[t] = px;
            prev_y[t] = py;
            prev_ok[t] = true;
          }

          // Publish zone counts/presence only on change to avoid state spam
          esphome::template_::TemplateSensor *count_sensors[4] = {
            id(poly_zone_1_count), id(poly_zone_2_count), id(poly_zone_3_count), id(poly_zone_4_count)
          };
          esphome::template_::TemplateBinarySensor *presence_sensors[4] = {
            id(poly_zone_1_presence), id(poly_zone_2_presence), id(poly_zone_3_presence), id(poly_zone_4_presence)
          };
          for (int z = 0; z < 4; z++) {
            if (!count_sensors[z]->has_state() || (int) count_sensors[z]->state != zone_count[z]) {
              count_sensors[z]->publish_state(zone_count[z]);
            }
            presence_sensors[z]->publish_state(zone_count[z] > 0);
          }
